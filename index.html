<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<title>Sign in - Welcome back</title>
</head>
<body class=" overflow-x-hidden">

  <!--content side-->
  <div class="min-h-screen md:h-screen flex flex-col md:flex-row">

    <div class="order-2 md:order-1 flex-1 flex items-center justify-center px-6 py-0 md:py-0 overflow-auto">

      <div class="h-full sm:h-auto w-full max-w-sm">

        <!-- heading -->
        <div class="mb-8 mt-4">
          <h1 class="text-2xl font-bold text-gray-900">Welcome Back 👋</h1>
          <p class="mt-2 text-sm text-gray-500">
            Today is a new day. It's your day. You shape it. Sign in to start managing your projects.
          </p>
        </div>

        <!-- form fields -->
        <form class="space-y-4">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Example@email.com"
              class="w-full  bg-[#F7FBFF] border border-[#D4D7E3] rounded-lg px-3 py-2 text-sm placeholder-gray-400
                     focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent"
            >
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="At least 8 characters"
              class="w-full bg-[#F7FBFF] border border-[#D4D7E3] rounded-lg  px-3 py-2 text-sm placeholder-gray-400
                     focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent"
            >
          </div>

          <!-- Forgot password: right-aligned like the mockup -->
          <div class="text-right">
            <a href="#" class="text-xs font-medium text-indigo-600 hover:underline">Forgot Password?</a>
          </div>

          <!-- Sign in button -->
          <button
            type="submit"
            class="w-full rounded-lg bg-[#162D3A] text-white text-sm font-medium py-2.5
                   hover:bg-[#0f1c26] transition-colors"
          >
            Sign in
          </button>
        </form>

        <!-- Divider with "Or" text centered in a horizontal rule -->
        <div class="flex items-center gap-3 my-6">
          <div class="h-px flex-1 bg-gray-200"></div>
          <span class="text-xs text-gray-400">Or <span class="inline md:hidden">sign in with</span></span>
          <div class="h-px flex-1 bg-gray-200"></div>
        </div>

        <!-- social sign in -->
        <div class="flex flex-row gap-3 md:flex-col">
          <button class="w-full bg-[#F3F9FA] flex items-center justify-center gap-2 rounded-lg
                         py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
            <svg class="w-6 h-6" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.9 12c0-.79.14-1.56.37-2.28V6.63H1.29A11.98 11.98 0 0 0 0 12c0 1.94.46 3.77 1.29 5.37l3.98-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.94 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.63l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
            <span class="hidden md:inline">Sign in with</span> Google
          </button>

          <button class="w-full bg-[#F3F9FA] flex items-center justify-center gap-2 rounded-lg 
                         py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
            <svg class="w-6 h-6" viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.7 4.53-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.95.93-1.95 1.89v2.26h3.32l-.53 3.49h-2.79V24C19.61 23.1 24 18.1 24 12.07z"/></svg>
            <span class="hidden md:inline">Sign in with</span> Facebook
          </button>
        </div>

        <!-- sign up -->
        <p class="text-center text-sm text-gray-500 mt-6">
          Don't you have an account?
          <a href="#" class="text-indigo-600 font-medium hover:underline">Sign up</a>
        </p>

        <!-- footer -->
        <p class="block text-center text-[11px] text-gray-400 mt-10 tracking-wide">
          &copy; 2023 ALL RIGHTS RESERVED
        </p>
      </div>
    </div>

    <!-- image side -->
    <div class="order-1 md:order-2 h-48 md:h-full md:flex-1 p-4 pb-0 md:p-6">
      <img
        src="flowers.png"
        alt="Still life flower painting"
        class="w-full h-full object-cover rounded-xl md:rounded-2xl shadow-md"
      >
    </div>

  </div>

</body>
</html>
